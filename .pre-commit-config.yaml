# Pinned pre-commit gates. Run locally with:
#   uvx pre-commit@4.7.0 run --all-files
# Install as a git hook with: uvx pre-commit@4.7.0 install
# The gitleaks hook builds from source on first run and needs a Go toolchain.
# Heavier scans (pip-audit, Semgrep, Trivy) live in scripts/checks/ and CI.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: debug-statements
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check (locked toolchain via uv)
        entry: uv run --frozen ruff check .
        language: system
        pass_filenames: false
        always_run: true
      - id: ruff-format-check
        name: ruff format check (locked toolchain via uv)
        entry: uv run --frozen ruff format --check .
        language: system
        pass_filenames: false
        always_run: true
      - id: mypy-strict
        name: mypy strict (locked toolchain via uv)
        entry: uv run --frozen mypy src
        language: system
        pass_filenames: false
        always_run: true
