# Continuous guardrails: tests, lint, types, build, and every security scan.
# Third-party actions are pinned by commit SHA (tag noted in comments);
# scanner tools are pinned by exact version in scripts/checks/ and below.
# All jobs fail the build on any violation. See TASK-002.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: tests, lint, types, build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        # actions/checkout v6.1.0
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Set up uv
        # astral-sh/setup-uv v7.6.0
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
      - name: Sync locked dependencies
        run: uv sync --frozen
      - name: Run tests
        run: uv run --frozen pytest
      - name: Lint
        run: uv run --frozen ruff check .
      - name: Format check
        run: uv run --frozen ruff format --check .
      - name: Type check
        run: uv run --frozen mypy src
      - name: Build distributions
        run: uv build

  secret-scan:
    name: secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        # actions/checkout v6.1.0
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - name: Scan history and tree for secrets
        # gitleaks/gitleaks-action v3.0.0; same Gitleaks as the pre-commit hook.
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: "8.30.1"

  dependency-audit:
    name: dependency audit (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        # actions/checkout v6.1.0
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Set up uv
        # astral-sh/setup-uv v7.6.0
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
      - name: Sync locked dependencies
        run: uv sync --frozen
      - name: Audit locked environment
        run: scripts/checks/dependency-audit.sh

  static-analysis:
    name: static analysis (semgrep)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        # actions/checkout v6.1.0
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Set up uv
        # astral-sh/setup-uv v7.6.0
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
      - name: Scan with Semgrep
        run: scripts/checks/static-analysis.sh

  container-scan:
    name: container scan (trivy)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        # actions/checkout v6.1.0
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Scan lab fixture images
        run: scripts/checks/container-scan.sh
